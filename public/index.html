<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Simple E-commerce Store</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
    body{background-color:#f4f7f6;color:#333}
    header{background-color:#2c3e50;color:white;padding:1rem 5%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 5px rgba(0,0,0,0.1);position:sticky;top:0;z-index:100}
    header h1{cursor:pointer}
    nav{display:flex;gap:10px}
    nav button{background-color:#3498db;color:white;border:none;padding:0.6rem 1.2rem;cursor:pointer;border-radius:4px;font-size:1rem;transition:background 0.3s}
    nav button:hover{background-color:#2980b9}
    .container{max-width:1200px;margin:2rem auto;padding:0 2rem}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2rem}
    .product-card{background:white;border-radius:8px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,0.05);transition:transform 0.3s;display:flex;flex-direction:column;justify-content:space-between}
    .product-card:hover{transform:translateY(-5px)}
    .product-img{width:100%;height:200px;object-fit:cover;background-color:#e0e0e0}
    .product-info{padding:1.2rem;display:flex;flex-direction:column;gap:0.5rem}
    .product-title{font-size:1.1rem;font-weight:bold}
    .product-price{color:#e74c3c;font-size:1.2rem;font-weight:bold}
    .btn{background-color:#2ecc71;color:white;border:none;padding:0.6rem;cursor:pointer;border-radius:4px;font-weight:bold;width:100%;transition:background 0.3s;margin-top:0.5rem}
    .btn:hover{background-color:#27ae60}
    .btn-secondary{background-color:#95a5a6}
    .btn-secondary:hover{background-color:#7f8c8d}
    .view{display:none}
    .view.active{display:block}
    .details-container{display:flex;gap:3rem;background:white;padding:2rem;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.05);flex-wrap:wrap}
    .details-img{width:400px;max-width:100%;height:350px;object-fit:cover;border-radius:8px;background-color:#e0e0e0}
    .details-info{display:flex;flex-direction:column;gap:1rem;justify-content:center}
    .cart-table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,0.05)}
    .cart-table th,.cart-table td{padding:1rem;text-align:left;border-bottom:1px solid #eee}
    .cart-table th{background-color:#f8f9fa}
    .cart-total{margin-top:1.5rem;text-align:right;font-size:1.3rem;font-weight:bold}
    .checkout-form{background:white;padding:2rem;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.05);max-width:500px;margin:2rem auto;display:flex;flex-direction:column;gap:1rem}
    .form-group{display:flex;flex-direction:column;gap:0.3rem}
    .form-group label{font-weight:bold}
    .form-group input{padding:0.6rem;border:1px solid #ccc;border-radius:4px;font-size:1rem}
    .success-msg{text-align:center;background:white;padding:3rem;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.05)}
    .success-msg h2{color:#2ecc71;margin-bottom:1rem}
    .auth-wrap{display:flex;gap:2rem;justify-content:center;flex-wrap:wrap}
    .auth-wrap .checkout-form{margin:0}
  </style>
</head>
<body>
  <header>
    <h1 onclick="switchView('home')">ShopEasy</h1>
    <nav>
      <button id="auth-btn" onclick="handleAuthClick()">Login</button>
      <button onclick="switchView('cart')">Cart (<span id="cart-count">0</span>)</button>
    </nav>
  </header>

  <div class="container">
    <div id="home-view" class="view active">
      <h2>Featured Products</h2>
      <div class="product-grid" id="product-grid" style="margin-top:1.5rem;"></div>
    </div>

    <div id="details-view" class="view">
      <button class="btn btn-secondary" style="width:auto;margin-bottom:1.5rem;" onclick="switchView('home')">&larr; Back to Products</button>
      <div class="details-container" id="details-container"></div>
    </div>

    <div id="cart-view" class="view">
      <button class="btn btn-secondary" style="width:auto;margin-bottom:1.5rem;" onclick="switchView('home')">&larr; Continue Shopping</button>
      <h2>Your Shopping Cart</h2>
      <div style="margin-top:1.5rem;" id="cart-content"></div>
    </div>

    <div id="checkout-view" class="view">
      <button class="btn btn-secondary" style="width:auto;margin-bottom:1.5rem;" onclick="switchView('cart')">&larr; Back to Cart</button>
      <h2>Checkout</h2>
      <form class="checkout-form" onsubmit="processOrder(event)">
        <div class="form-group"><label>Full Name</label><input type="text" required placeholder="Priyanka Nalavade"></div>
        <div class="form-group"><label>Shipping Address</label><input type="text" required placeholder="Enter your full address"></div>
        <div class="form-group"><label>Phone Number</label><input type="tel" required placeholder="9876543210"></div>
        <button type="submit" class="btn">Place Order</button>
      </form>
    </div>

    <div id="success-view" class="view">
      <div class="success-msg">
        <h2>Order Placed Successfully! 🎉</h2>
        <p>Thank you for shopping with us. Your order has been saved and will be shipped soon.</p>
        <button class="btn" style="width:auto;margin-top:2rem;" onclick="switchView('home')">Back to Home</button>
      </div>
    </div>

    <div id="auth-view" class="view">
      <button class="btn btn-secondary" style="width:auto;margin-bottom:1.5rem;" onclick="switchView('home')">&larr; Back to Home</button>
      <h2>Login / Register</h2>
      <div class="auth-wrap" style="margin-top:1.5rem;">
        <form class="checkout-form" onsubmit="loginUser(event)">
          <h3 style="margin-bottom:1rem;">Login</h3>
          <div class="form-group"><label>Email</label><input type="email" id="login-email" required></div>
          <div class="form-group"><label>Password</label><input type="password" id="login-pass" required></div>
          <button type="submit" class="btn">Login</button>
        </form>

        <form class="checkout-form" onsubmit="registerUser(event)">
          <h3 style="margin-bottom:1rem;">Register</h3>
          <div class="form-group"><label>Name</label><input type="text" id="reg-name" required></div>
          <div class="form-group"><label>Email</label><input type="email" id="reg-email" required></div>
          <div class="form-group"><label>Password</label><input type="password" id="reg-pass" required></div>
          <button type="submit" class="btn">Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Fallback products if DB fails
    const FALLBACK = [
      { _id:'1', name:"Wireless Headphones", price:2499, image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60", description:"Crystal-clear sound with active noise cancellation and long battery life." },
      { _id:'2', name:"Smart Watch", price:3999, image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60", description:"Track health, notifications and fitness goals." },
      { _id:'3', name:"Minimalist Backpack", price:1499, image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&auto=format&fit=crop&q=60", description:"Durable, water-resistant and spacious." },
      { _id:'4', name:"Mechanical Keyboard", price:2999, image:"https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500&auto=format&fit=crop&q=60", description:"RGB backlighting with responsive switches." }
    ];

    let products = [], cart = [];
    let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');

    function updateAuthBtn() {
      document.getElementById('auth-btn').innerText = currentUser ? `Hi, ${currentUser.name}` : 'Login';
    }

    function handleAuthClick() {
      if (currentUser) {
        if (confirm('Logout?')) { currentUser = null; localStorage.removeItem('currentUser'); updateAuthBtn(); }
      } else { switchView('auth'); }
    }

    function switchView(v) {
      document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
      document.getElementById(v + '-view').classList.add('active');
      window.scrollTo(0, 0);
      if (v === 'cart') renderCart();
    }

    async function renderProducts() {
      let data = [];
      try {
        let res = await fetch('/api/products');
        data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
          await fetch('/api/seed');
          res = await fetch('/api/products');
          data = await res.json();
        }
      } catch (e) { console.log('Using fallback products', e); }
      
      if (!Array.isArray(data) || data.length === 0) data = FALLBACK;
      products = data;
      
      document.getElementById('product-grid').innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.image}" alt="${p.name}" class="product-img">
          <div class="product-info">
            <div class="product-title">${p.name}</div>
            <div class="product-price">₹${p.price}</div>
            <button class="btn btn-secondary" onclick="viewDetails('${p._id}')">View Details</button>
            <button class="btn" onclick="addToCart('${p._id}')">Add to Cart</button>
          </div>
        </div>`).join('');
    }

    function viewDetails(id) {
      const p = products.find(x => x._id === id);
      if (!p) return alert('Product not found');
      document.getElementById('details-container').innerHTML = `
        <img src="${p.image}" class="details-img">
        <div class="details-info">
          <h2>${p.name}</h2>
          <h3 style="color:#e74c3c;">₹${p.price}</h3>
          <p>${p.description}</p>
          <button class="btn" style="max-width:200px;" onclick="addToCart('${p._id}'); switchView('cart');">Add to Cart & Checkout</button>
        </div>`;
      switchView('details');
    }

    function addToCart(id) {
      const p = products.find(x => x._id === id);
      if (!p) return alert('Product not found');
      const ex = cart.find(i => i._id === id);
      if (ex) ex.quantity += 1;
      else cart.push({ ...p, quantity: 1 });
      updateCartCount();
      alert(`${p.name} added to cart!`);
    }

    function updateCartCount() {
      document.getElementById('cart-count').innerText = cart.reduce((s, i) => s + i.quantity, 0);
    }

    function renderCart() {
      const box = document.getElementById('cart-content');
      if (cart.length === 0) { box.innerHTML = `<p>Your cart is empty.</p>`; return; }
      
      let total = 0;
      let html = `<table class="cart-table"><thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th></tr></thead><tbody>`;
      cart.forEach(i => {
        const s = i.price * i.quantity;
        total += s;
        html += `<tr><td>${i.name}</td><td>₹${i.price}</td><td>${i.quantity}</td><td>₹${s}</td></tr>`;
      });
      html += `</tbody></table>
        <div class="cart-total">Total: ₹${total}</div>
        <div style="text-align:right;margin-top:1.5rem;">
          <button class="btn" style="width:auto;padding:0.8rem 2rem;" onclick="switchView('checkout')">Proceed to Checkout</button>
        </div>`;
      box.innerHTML = html;
    }

    async function processOrder(e) {
      e.preventDefault();
      if (!currentUser) { alert('Please login first!'); switchView('auth'); return; }
      if (cart.length === 0) { alert('Cart is empty!'); return; }
      
      const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
      
      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerName: e.target[0].value,
            address: e.target[1].value,
            phone: e.target[2].value,
            items: cart,
            total,
            userEmail: currentUser.email
          })
        });
        if (!res.ok) {
          const err = await res.json().catch(()=>({ error: 'Unknown server error' }));
          console.error('Order failed', err);
          alert(err.error || 'Order failed on server');
          return;
        }
      } catch (err) { console.log('Order saved locally', err); /* fallback behaviour */ }
      
      cart = [];
      updateCartCount();
      switchView('success');
    }

    async function registerUser(e) {
      e.preventDefault();
      try {
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-pass').value;
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert('✅ Registered! Please Login.');
          switchView('auth');
        } else {
          alert(data.error || 'Registration failed');
        }
      } catch (err) {
        console.error('Register error:', err);
        alert('⚠️ DB not connected - demo mode');
      }
    }

    async function loginUser(e) {
      e.preventDefault();
      try {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-pass').value;
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          currentUser = data.user;
          localStorage.setItem('currentUser', JSON.stringify(data.user));
          updateAuthBtn();
          alert('Welcome ' + data.user.name + '!');
          switchView('home');
        } else {
          alert(data.error || 'Invalid credentials.');
        }
      } catch (err) {
        console.error('Login error:', err);
        alert('⚠️ DB not connected - demo mode');
      }
    }

    // Initialize
    renderProducts();
    updateAuthBtn();
  </script>
</body>
</html>
