<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConnectApp - Mini Social Media</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',Tahoma,sans-serif}
body{background:linear-gradient(180deg,#f5f2ff 0%,#fdeef7 100%);min-height:100vh;color:#333}
header{background:linear-gradient(90deg,#7b2ff7,#f107a3);color:#fff;padding:.8rem 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 4px 15px rgba(123,47,247,.35)}
header h1{cursor:pointer;font-size:1.45rem;font-weight:700;letter-spacing:.5px}
nav{display:flex;gap:8px}
nav button{background:rgba(255,255,255,.18);color:#fff;border:none;padding:.5rem 1rem;border-radius:20px;cursor:pointer;font-size:.9rem;font-weight:600;transition:.25s}
nav button:hover{background:#fff;color:#7b2ff7;transform:translateY(-1px)}
.container{max-width:650px;margin:1.5rem auto;padding:0 1rem}
.view{display:none}
.view.active{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(123,47,247,.08);padding:1rem;margin-bottom:1rem;transition:.25s}
.card:hover{box-shadow:0 6px 24px rgba(123,47,247,.15)}
.post-head{display:flex;justify-content:space-between;margin-bottom:.5rem}
.author{font-weight:600;color:#7b2ff7;cursor:pointer}
.author:hover{text-decoration:underline}
.time{color:#999;font-size:.78rem}
.post-content{margin-bottom:.6rem;white-space:pre-wrap}
.post-img{width:100%;border-radius:12px;max-height:380px;object-fit:cover;margin-bottom:.6rem}
.post-actions{display:flex;gap:10px;border-top:1px solid #f0eafc;padding-top:.6rem}
.post-actions button{background:none;border:none;cursor:pointer;font-size:.95rem;color:#666;padding:.3rem .8rem;border-radius:8px;transition:.2s}
.post-actions button:hover{background:#f5f2ff}
.post-actions button.liked{color:#f107a3;font-weight:700}
.comments{margin-top:.7rem;border-top:1px solid #f0eafc;padding-top:.7rem}
.comment{background:#f5f2ff;border-radius:14px;padding:.5rem .9rem;margin-bottom:.4rem;font-size:.9rem}
.comment-box{display:flex;gap:6px;margin-top:.5rem}
.comment-box input{flex:1;border:1px solid #e0d7f7;border-radius:20px;padding:.45rem .9rem;font-size:.9rem;outline:none}
.comment-box input:focus{border-color:#7b2ff7}
.comment-box button{background:linear-gradient(90deg,#7b2ff7,#f107a3);color:#fff;border:none;border-radius:20px;padding:.4rem 1.1rem;cursor:pointer;font-weight:600}
.composer textarea{width:100%;border:1px solid #e0d7f7;border-radius:12px;padding:.7rem;font-size:.95rem;resize:vertical;min-height:70px;outline:none}
.composer textarea:focus{border-color:#7b2ff7}
.composer .row{display:flex;gap:8px;margin-top:.6rem;align-items:center;flex-wrap:wrap}
.composer .row input{flex:1;border:1px solid #e0d7f7;border-radius:10px;padding:.5rem;font-size:.85rem;outline:none;min-width:180px}
.photo-btn{background:#f5f2ff;color:#7b2ff7;border:1px dashed #7b2ff7;padding:.5rem 1rem;border-radius:10px;cursor:pointer;font-weight:600;font-size:.85rem;transition:.2s}
.photo-btn:hover{background:#ede6ff}
#img-preview{display:none;width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-top:.6rem}
.btn{background:#eee6fb;color:#5b21b6;border:none;padding:.55rem 1.2rem;border-radius:10px;cursor:pointer;font-weight:600;margin-top:.6rem;transition:.2s}
.btn.primary{background:linear-gradient(90deg,#7b2ff7,#f107a3);color:#fff;box-shadow:0 4px 12px rgba(123,47,247,.3)}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.person{display:flex;justify-content:space-between;align-items:center}
.tag{background:#ede6ff;color:#7b2ff7;padding:.3rem .8rem;border-radius:14px;font-size:.8rem;font-weight:600}
.profile-head{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#7b2ff7,#f107a3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;box-shadow:0 4px 14px rgba(123,47,247,.35)}
.stats{display:flex;gap:1.2rem;margin-top:.5rem;font-size:.9rem;color:#666}
.empty{text-align:center;color:#999;padding:2rem}
.auth-wrap{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center;margin-top:2rem}
.auth-form{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(123,47,247,.15);padding:1.5rem;width:290px;display:flex;flex-direction:column;gap:.8rem}
.auth-form h3{background:linear-gradient(90deg,#7b2ff7,#f107a3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:1.3rem}
.form-group{display:flex;flex-direction:column;gap:.25rem}
.form-group label{font-weight:600;font-size:.88rem;color:#555}
.form-group input{padding:.55rem;border:1px solid #e0d7f7;border-radius:10px;font-size:.95rem;outline:none}
.form-group input:focus{border-color:#7b2ff7}
</style>
</head>
<body>
<header>
  <h1 onclick="if(currentUser)switchView('feed')">🌐 ConnectApp</h1>
  <nav id="nav-auth" style="display:none"><button onclick="switchView('auth')">Login</button></nav>
  <nav id="nav-main" style="display:none">
    <button onclick="switchView('feed')">🏠 Feed</button>
    <button onclick="switchView('people')">👥 People</button>
    <button onclick="openProfile(currentUser._id)">😊 My Profile</button>
    <button onclick="logout()">🚪 Logout</button>
  </nav>
</header>
<div class="container">
  <div id="auth-view" class="view">
    <div class="auth-wrap">
      <form class="auth-form" onsubmit="loginUser(event)">
        <h3>Login</h3>
        <div class="form-group"><label>Email</label><input type="email" id="login-email" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="login-pass" required></div>
        <button class="btn primary" type="submit">Login</button>
      </form>
      <form class="auth-form" onsubmit="registerUser(event)">
        <h3>Register</h3>
        <div class="form-group"><label>Name</label><input type="text" id="reg-name" required></div>
        <div class="form-group"><label>Email</label><input type="email" id="reg-email" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="reg-pass" required></div>
        <button class="btn primary" type="submit">Create Account</button>
      </form>
    </div>
  </div>

  <div id="feed-view" class="view">
    <div class="card composer">
      <textarea id="post-input" placeholder="What's on your mind?"></textarea>
      <img id="img-preview" alt="preview">
      <div class="row">
        <label class="photo-btn" for="post-image">📷 Photo Upload</label>
        <input type="file" id="post-image" accept="image/*" style="display:none" onchange="previewImage(this)">
        <input id="post-url" placeholder="Ya image URL (optional)">
      </div>
      <button class="btn primary" onclick="createPost()">🚀 Post</button>
    </div>
    <div id="feed"></div>
  </div>

  <div id="people-view" class="view">
    <h2 style="margin-bottom:1rem;color:#7b2ff7;">👥 People</h2>
    <div id="people-list"></div>
  </div>

  <div id="profile-view" class="view">
    <button class="btn" onclick="switchView('feed')">&larr; Back to Feed</button>
    <div id="profile-box" style="margin-top:1rem;"></div>
  </div>
</div>
<script>
let currentUser = JSON.parse(localStorage.getItem('sm_user') || 'null');
let currentView = 'auth', currentProfileId = null;

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

function updateNav(){
  document.getElementById('nav-main').style.display = currentUser ? 'flex' : 'none';
  document.getElementById('nav-auth').style.display = currentUser ? 'none' : 'flex';
}

function switchView(v){
  currentView = v;
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.getElementById(v+'-view').classList.add('active');
  if(v==='feed') renderFeed();
  if(v==='people') renderPeople();
}

function openProfile(id){
  currentProfileId = id;
  currentView = 'profile';
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.getElementById('profile-view').classList.add('active');
  renderProfile(id);
}

function refresh(){
  if(currentView==='feed') renderFeed();
  else if(currentView==='people') renderPeople();
  else if(currentView==='profile') renderProfile(currentProfileId);
}

function logout(){
  if(confirm('Logout?')){ currentUser=null; localStorage.removeItem('sm_user'); updateNav(); switchView('auth'); }
}

function previewImage(input){
  const prev = document.getElementById('img-preview');
  if(input.files && input.files[0]){
    const r = new FileReader();
    r.onload = e => { prev.src = e.target.result; prev.style.display='block'; };
    r.readAsDataURL(input.files[0]);
  } else prev.style.display='none';
}

async function registerUser(e){
  e.preventDefault();
  try{
    const res = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      name: document.getElementById('reg-name').value.trim(),
      email: document.getElementById('reg-email').value.trim(),
      password: document.getElementById('reg-pass').value
    })});
    const data = await res.json();
    if(res.ok && data.success) alert('✅ Registered! Please Login.');
    else alert(data.error || 'Registration failed');
  }catch(err){ console.error(err); alert('⚠️ Server/DB not connected'); }
}

async function loginUser(e){
  e.preventDefault();
  try{
    const res = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      email: document.getElementById('login-email').value.trim(),
      password: document.getElementById('login-pass').value
    })});
    const data = await res.json();
    if(res.ok && data.success){
      currentUser = data.user;
      localStorage.setItem('sm_user', JSON.stringify(data.user));
      updateNav();
      switchView('feed');
    } else alert(data.error || 'Invalid credentials');
  }catch(err){ console.error(err); alert('⚠️ Server/DB not connected'); }
}

async function createPost(){
  const content = document.getElementById('post-input').value.trim();
  const url = document.getElementById('post-url').value.trim();
  const fileInput = document.getElementById('post-image');
  const file = fileInput.files[0];
  if(!content && !file && !url){ alert('Post cannot be empty!'); return; }
  const fd = new FormData();
  fd.append('author', currentUser._id);
  fd.append('content', content);
  fd.append('imageUrl', url);
  if(file) fd.append('image', file);
  try{
    const res = await fetch('/api/posts',{ method:'POST', body: fd });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Post failed');
    document.getElementById('post-input').value='';
    document.getElementById('post-url').value='';
    fileInput.value='';
    document.getElementById('img-preview').style.display='none';
    renderFeed();
  }catch(err){ alert('⚠️ ' + err.message); }
}

function postCard(p){
  const liked = currentUser && p.likes.includes(currentUser._id);
  const aName = p.author ? p.author.name : 'User';
  const aId = p.author ? p.author._id : '';
  return `<div class="card">
    <div class="post-head">
      <span class="author" onclick="openProfile('${aId}')">${escapeHtml(aName)}</span>
      <span class="time">${new Date(p.date).toLocaleString()}</span>
    </div>
    <div class="post-content">${escapeHtml(p.content)}</div>
    ${p.image ? `<img class="post-img" src="${escapeAttr(p.image)}" onerror="this.style.display='none'">` : ''}
    <div class="post-actions">
      <button class="${liked?'liked':''}" onclick="likePost('${p._id}')">❤️ ${p.likes.length}</button>
      <button onclick="toggleComments('${p._id}')">💬 ${p.comments.length}</button>
    </div>
    <div id="comments-${p._id}" class="comments" style="display:none">
      ${p.comments.map(c=>`<div class="comment"><b>${escapeHtml(c.author?c.author.name:'User')}:</b> ${escapeHtml(c.text)}</div>`).join('')}
      <div class="comment-box">
        <input id="cin-${p._id}" placeholder="Write a comment...">
        <button onclick="addComment('${p._id}')">Send</button>
      </div>
    </div>
  </div>`;
}

async function renderFeed(){
  const box = document.getElementById('feed');
  box.innerHTML = '<p class="empty">Loading feed...</p>';
  try{
    const res = await fetch('/api/posts');
    const posts = await res.json();
    if(!Array.isArray(posts)) throw 0;
    box.innerHTML = posts.length ? posts.map(postCard).join('') : '<p class="empty">No posts yet. Be the first! 🚀</p>';
  }catch(e){ box.innerHTML = '<p class="empty">⚠️ Server/DB not connected.</p>'; }
}

function toggleComments(id){
  const el = document.getElementById('comments-'+id);
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}

async function likePost(id){
  await fetch(`/api/posts/${id}/like`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ userId: currentUser._id })});
  refresh();
}

async function addComment(id){
  const input = document.getElementById('cin-'+id);
  const text = input.value.trim();
  if(!text) return;
  await fetch(`/api/posts/${id}/comment`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ userId: currentUser._id, text })});
  refresh();
  const el = document.getElementById('comments-'+id);
  if(el) el.style.display='block';
}

async function renderPeople(){
  const box = document.getElementById('people-list');
  try{
    const res = await fetch('/api/users');
    const users = await res.json();
    box.innerHTML = users.map(u=>{
      const me = u._id===currentUser._id;
      const following = u.followers.includes(currentUser._id);
      return `<div class="card person">
        <div><span class="author" onclick="openProfile('${u._id}')">${escapeHtml(u.name)}</span><br>
        <small style="color:#999">${u.followers.length} followers · ${u.following.length} following</small></div>
        ${me ? '<span class="tag">You</span>' : `<button class="btn ${following?'':'primary'}" onclick="followUser('${u._id}')">${following?'Unfollow':'Follow'}</button>`}
      </div>`;
    }).join('') || '<p class="empty">No users yet.</p>';
  }catch(e){ box.innerHTML = '<p class="empty">⚠️ Server/DB not connected.</p>'; }
}

async function followUser(id){
  await fetch(`/api/users/${id}/follow`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ userId: currentUser._id })});
  refresh();
}

async function renderProfile(id){
  const box = document.getElementById('profile-box');
  box.innerHTML = '<p class="empty">Loading profile...</p>';
  try{
    const res = await fetch('/api/users/'+id);
    const data = await res.json();
    const u = data.user, posts = data.posts;
    const me = currentUser._id===u._id;
    const following = u.followers.includes(currentUser._id);
    box.innerHTML = `
      <div class="card profile-head">
        <div class="avatar">${escapeHtml(u.name.charAt(0).toUpperCase())}</div>
        <div style="flex:1">
          <h2 style="color:#444">${escapeHtml(u.name)}</h2>
          <p style="color:#777">${escapeHtml(u.bio)}</p>
          <small style="color:#999">${escapeHtml(u.email)}</small>
          <div class="stats">
            <span><b style="color:#7b2ff7">${posts.length}</b> Posts</span>
            <span><b style="color:#7b2ff7">${u.followers.length}</b> Followers</span>
            <span><b style="color:#7b2ff7">${u.following.length}</b> Following</span>
          </div>
        </div>
        ${me?'':`<button class="btn ${following?'':'primary'}" onclick="followUser('${u._id}')">${following?'Unfollow':'Follow'}</button>`}
      </div>
      <h3 style="margin:1rem 0 .7rem;color:#7b2ff7;">Posts by ${escapeHtml(u.name)}</h3>
      ${posts.length ? posts.map(postCard).join('') : '<p class="empty">No posts yet.</p>'}
    `;
  }catch(e){ box.innerHTML = '<p class="empty">⚠️ Server/DB not connected.</p>'; }
}

updateNav();
if(currentUser) switchView('feed'); else switchView('auth');
</script>
</body>
</html>
